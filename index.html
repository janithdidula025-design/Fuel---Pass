<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/483/483497.png">

    <link rel="manifest" href='data:application/json,{"id":"fuelpass-v30","name":"Fuel Pass Pro","short_name":"FuelPass","start_url":"index.html","display":"standalone","background_color":"#000000","theme_color":"#ffd700","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/483/483497.png","sizes":"512x512","type":"image/png"}]}'>

    <title>Fuel Pass Pro</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600&display=swap');
        :root { --gold: #FFD700; --red: #ff4444; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0; background: #000; font-family: 'Poppins', sans-serif; color: white;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            padding-top: env(safe-area-inset-top);
        }

        /* Header */
        .header { 
            padding: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo-area { display: flex; flex-direction: column; }
        .logo-text { font-family: 'Orbitron'; font-size: 0.8rem; color: var(--gold); letter-spacing: 1px; margin: 0; }
        .version-text { font-size: 0.6rem; opacity: 0.4; }

        .btn-update {
            background: rgba(255, 215, 0, 0.1);
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* UI Elements */
        .tabs { display: flex; gap: 10px; padding: 10px 15px; }
        .tab-btn { flex: 1; padding: 12px; border: 1px solid rgba(255,255,255,0.1); background: var(--glass); color: #777; border-radius: 12px; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: black; border: none; }

        .view { display: none; flex: 1; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 15px; }
        .view.active { display: flex; }

        .qr-frame {
            background: #fff; width: 82vw; height: 82vw; max-width: 350px; max-height: 350px;
            border-radius: 20px; padding: 10px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(255,215,0,0.1);
        }
        #mainQr { width: 100%; height: 100%; object-fit: contain; }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 15px 5px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .s-val { color: var(--gold); font-size: 1.1rem; font-weight: 700; display: block; }
        .s-lbl { font-size: 0.55rem; opacity: 0.5; text-transform: uppercase; }

        #vList { width: 100%; overflow-y: auto; padding: 10px; }
        .v-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; }
        .v-card.selected { border-color: var(--gold); background: rgba(255, 215, 0, 0.08); }

        .btn-main { background: var(--gold); color: black; border: none; padding: 18px; border-radius: 15px; font-weight: 900; width: 90%; font-family: 'Orbitron'; cursor: pointer; margin-bottom: 20px; }

        #overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 1000; padding: 25px; flex-direction: column; justify-content: center; }
        input, select { width: 100%; padding: 15px; border-radius: 12px; background: #111; border: 1px solid #333; color: white; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <p class="logo-text">FUEL PASS PRO</p>
            <span class="version-text">Version 3.0</span>
        </div>
        <button class="btn-update" onclick="checkUpdate()">CHECK UPDATE</button>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btnH" onclick="switchTab('home', this)">MY CARD</button>
        <button class="tab-btn" id="btnM" onclick="switchTab('manage', this)">GARAGE</button>
    </div>

    <div id="home" class="view active">
        <h2 id="dispV" style="margin:0; font-family:'Orbitron'; color:#fff;">NO VEHICLE</h2>
        <div class="qr-frame">
            <img id="mainQr" src="" style="display:none;">
            <p id="noQrText" style="color:#000; font-weight:bold; text-align:center;">UPLOAD QR TO START</p>
        </div>
        <div class="stats-grid">
            <div class="stat-box"><span class="s-val" id="dispQ">0L</span><span class="s-lbl">Quota</span></div>
            <div class="stat-box"><span class="s-val" id="dispU" style="color:var(--red)">0L</span><span class="s-lbl">Used</span></div>
            <div class="stat-box"><span class="s-val" id="dispR" style="color:#00ff88">0L</span><span class="s-lbl">Balance</span></div>
        </div>
    </div>

    <div id="manage" class="view">
        <div id="vList"></div>
        <button class="btn-main" onclick="openForm()">+ ADD VEHICLE</button>
    </div>

    <div id="overlay">
        <h2 style="color:var(--gold); text-align:center; font-family:'Orbitron';">SETTINGS</h2>
        <select id="inT"><option>🚗 Car</option><option>🏍️ Bike</option><option>🛺 Tuk</option><option>🚐 Van</option></select>
        <input type="text" id="inV" placeholder="Vehicle No">
        <input type="number" id="inQ" placeholder="Quota (L)">
        <input type="number" id="inU" placeholder="Used (L)">
        <input type="file" id="inF" accept="image/*">
        <button class="btn-main" onclick="saveData()">SAVE DATA</button>
        <p onclick="hideForm()" style="text-align:center; color:var(--red); cursor:pointer; font-weight:bold; margin-top:20px;">CANCEL</p>
    </div>

    <script>
        // Default වාහන දත්ත (GitHub image link මෙතනට replace කරන්න)
        const defaultVehicles = [
            {
                no: "CAD-1234",
                type: "🚗 Car",
                q: 20,
                u: 5,
                qr: "car_qr.png" // ඔබගේ GitHub Repo එකේ Car QR රූපයේ URL එක මෙහි යොදන්න
            },
            {
                no: "BIKE-5678",
                type: "🏍️ Bike",
                q: 7,
                u: 2,
                qr: "bike_qr.png" // ඔබගේ GitHub Repo එකේ Bike QR රූපයේ URL එක මෙහි යොදන්න
            }
        ];

        let vehicles = JSON.parse(localStorage.getItem('fuel_pro_v3'));

        // Local Storage එකේ කලින් saved data නැත්නම් defaultData ගන්නවා
        if (!vehicles || vehicles.length === 0) {
            vehicles = defaultVehicles;
            localStorage.setItem('fuel_pro_v3', JSON.stringify(vehicles));
        }

        let activeIdx = 0;

        function checkUpdate() {
            if (confirm("අලුත් Update එකක් තිබේදැයි පරීක්ෂා කර බලමුද?")) {
                window.location.reload(true);
            }
        }

        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));`;
                const blob = new Blob([swCode], {type: 'text/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob));
            });
        }

        function switchTab(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            id === 'home' ? renderHome() : renderManage();
        }

        function selectVehicle(index) {
            activeIdx = index;
            renderHome();
            switchTab('home', document.getElementById('btnH'));
        }

        function renderHome() {
            if (vehicles.length === 0) {
                document.getElementById('dispV').innerText = "NO VEHICLE";
                document.getElementById('dispQ').innerText = "0L";
                document.getElementById('dispU').innerText = "0L";
                document.getElementById('dispR').innerText = "0L";
                document.getElementById('mainQr').style.display = 'none';
                document.getElementById('noQrText').style.display = 'block';
                return;
            }
            const v = vehicles[activeIdx] || vehicles[0];
            document.getElementById('dispV').innerText = v.no;
            document.getElementById('dispQ').innerText = v.q + "L";
            document.getElementById('dispU').innerText = v.u + "L";
            document.getElementById('dispR').innerText = (v.q - v.u) + "L";
            
            if (v.qr) {
                document.getElementById('mainQr').src = v.qr;
                document.getElementById('mainQr').style.display = 'block';
                document.getElementById('noQrText').style.display = 'none';
            } else {
                document.getElementById('mainQr').style.display = 'none';
                document.getElementById('noQrText').style.display = 'block';
            }
        }

        function renderManage() {
            const list = document.getElementById('vList');
            list.innerHTML = '';
            vehicles.forEach((v, i) => {
                const isSelected = i === activeIdx ? 'selected' : '';
                list.innerHTML += `<div class="v-card ${isSelected}" onclick="selectVehicle(${i})">
                    <div><b>${v.no}</b><br><small style="opacity:0.5">${v.type}</small></div>
                    <button onclick="event.stopPropagation(); del(${i})" style="background:var(--red); color:white; border:none; padding:8px 12px; border-radius:10px; font-size:0.7rem; cursor:pointer;">DEL</button>
                </div>`;
            });
        }

        function openForm() { document.getElementById('overlay').style.display = 'flex'; }
        function hideForm() { document.getElementById('overlay').style.display = 'none'; }

        function saveData() {
            const no = document.getElementById('inV').value.toUpperCase();
            const q = document.getElementById('inQ').value;
            const u = document.getElementById('inU').value || 0;
            const type = document.getElementById('inT').value;
            const f = document.getElementById('inF').files[0];

            if (!no || !q) return alert("කරුණාකර අනිවාර්ය විස්තර (වාහන අංකය සහ Quota) ඇතුළත් කරන්න!");

            const createRecord = (qrUrl) => {
                vehicles.push({ no, q, u, type, qr: qrUrl });
                localStorage.setItem('fuel_pro_v3', JSON.stringify(vehicles));
                activeIdx = vehicles.length - 1;
                hideForm();
                renderHome();
                switchTab('home', document.getElementById('btnH'));
            };

            if (f) {
                const reader = new FileReader();
                reader.onload = e => createRecord(e.target.result);
                reader.readAsDataURL(f);
            } else {
                createRecord("");
            }
        }

        function del(i) {
            if (confirm("මෙම වාහනය මකමුද?")) {
                vehicles.splice(i, 1);
                if (activeIdx >= vehicles.length) activeIdx = Math.max(0, vehicles.length - 1);
                localStorage.setItem('fuel_pro_v3', JSON.stringify(vehicles));
                renderManage();
                renderHome();
            }
        }

        window.onload = renderHome;
    </script>
</body>
</html>
