<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FuelPass Pro">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/483/483497.png">

    <link rel="manifest" href='data:application/json,{"id":"fuelpass-v20","name":"Fuel Pass Max Pro","short_name":"FuelPass","start_url":"index.html","display":"standalone","background_color":"#000000","theme_color":"#ffd700","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/483/483497.png","sizes":"512x512","type":"image/png","purpose":"any maskable"}]}'>

    <title>Fuel Pass Max Pro</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Poppins:wght@300;600&display=swap');
        :root { --gold: #FFD700; --accent: #00F2FF; --red: #ff4444; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body {
            margin: 0; padding: 0; background: #000; font-family: 'Poppins', sans-serif; color: white;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
            padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
        }

        body::before {
            content: ""; position: fixed; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, #000 100%), 
                        url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2000') center/cover;
            z-index: -1; filter: blur(15px);
        }

        .header { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .logo-text { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; color: var(--gold); letter-spacing: 2px; margin: 0; }
        .v-label { font-size: 0.6rem; opacity: 0.5; border: 1px solid rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 5px; }

        .tabs { display: flex; gap: 10px; padding: 5px 15px; height: 50px; }
        .tab-btn { flex: 1; border: 1px solid rgba(255,255,255,0.1); background: var(--glass); color: #777; border-radius: 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .tab-btn.active { background: var(--gold); color: black; border: none; box-shadow: 0 4px 15px rgba(255,215,0,0.3); }

        .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .view.active { display: flex; }

        .home-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 10px; }
        .v-no-main { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900; color: #fff; margin: 0; text-shadow: 0 0 10px rgba(0,242,255,0.3); }

        .qr-art-frame {
            background: #FFFFFF; width: 85vw; height: 85vw; max-width: 380px; max-height: 380px;
            border-radius: 20px; padding: 10px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        #mainQr { width: 100%; height: 100%; object-fit: contain; }

        .stats-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; width: 92vw; }
        .stat-card { background: rgba(0,0,0,0.7); padding: 12px 5px; border-radius: 15px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .s-val { color: var(--gold); font-size: 1.1rem; font-weight: 700; display: block; }
        .s-lbl { font-size: 0.55rem; opacity: 0.5; text-transform: uppercase; }

        #vList { flex: 1; overflow-y: auto; padding: 15px; }
        .manage-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 18px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.03); }
        .btn-del { background: rgba(255,68,68,0.1); border: 1px solid var(--red); color: var(--red); padding: 8px 12px; border-radius: 10px; font-size: 10px; font-weight: bold; }

        .bottom-actions { padding: 20px; }
        .btn-add { background: var(--gold); color: black; border: none; padding: 18px; border-radius: 18px; font-weight: 900; width: 100%; font-family: 'Orbitron'; cursor: pointer; }

        #formOverlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; padding: 25px; flex-direction: column; justify-content: center; }
        input, select { width: 100%; padding: 16px; border-radius: 12px; background: #111; border: 1px solid #333; color: white; margin-bottom: 12px; font-size: 1rem; }
    </style>
</head>
<body>

    <div class="header">
        <p class="logo-text">FUEL PASS PRO</p>
        <span class="v-label">SYSTEM V20</span>
    </div>

    <div class="tabs">
        <button class="tab-btn active" id="btnH" onclick="switchTab('home', this)">MY CARD</button>
        <button class="tab-btn" id="btnM" onclick="switchTab('manage', this)">GARAGE</button>
    </div>

    <div id="home" class="view active">
        <div class="home-content">
            <p class="v-no-main" id="dispV">NO VEHICLE</p>
            <div class="qr-art-frame">
                <img id="mainQr" src="" style="display:none;">
                <p id="noQrText" style="color:#000; font-weight:bold; text-align:center;">UPLOAD QR TO START</p>
            </div>
            <div class="stats-row">
                <div class="stat-card"><span class="s-val" id="dispQ">0L</span><span class="s-lbl">Quota</span></div>
                <div class="stat-card"><span class="s-val" id="dispU" style="color:var(--red)">0L</span><span class="s-lbl">Used</span></div>
                <div class="stat-card"><span class="s-val" id="dispR" style="color:#00ff88">0L</span><span class="s-lbl">Balance</span></div>
            </div>
        </div>
    </div>

    <div id="manage" class="view">
        <div id="vList"></div>
        <div class="bottom-actions"><button class="btn-add" onclick="openForm()">+ ADD VEHICLE</button></div>
    </div>

    <div id="formOverlay">
        <h2 style="font-family:'Orbitron'; color:var(--gold); text-align:center; margin-bottom:30px;">VEHICLE SETUP</h2>
        <select id="inT">
            <option>🚗 Car</option><option>🏍️ Bike</option><option>🛺 Tuk Tuk</option><option>🚐 Van</option><option>🚛 Truck</option>
        </select>
        <input type="text" id="inV" placeholder="Vehicle No (Ex: CAB-1234)">
        <input type="number" id="inQ" placeholder="Weekly Quota (L)">
        <input type="number" id="inU" placeholder="Current Used (L)">
        <label style="font-size: 0.7rem; color: #888; margin-bottom: 5px; display: block;">Select QR Photo</label>
        <input type="file" id="inF" accept="image/*">
        <button class="btn-add" onclick="saveData()" style="margin-top:20px;">SAVE DATA</button>
        <p onclick="hideForm()" style="color:var(--red); text-align:center; margin-top:25px; cursor:pointer; font-weight:bold;">CANCEL</p>
    </div>

    <script>
        // === CRITICAL: SERVICE WORKER FOR INSTALLATION ===
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', e => self.skipWaiting());
                    self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                    self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
                `;
                const blob = new Blob([swCode], {type: 'text/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob));
            });
        }

        let vehicles = JSON.parse(localStorage.getItem('fuel_v20')) || [];
        let activeIdx = 0;

        function switchTab(id, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            id === 'home' ? renderHome() : renderManage();
        }

        function renderHome() {
            if(vehicles.length === 0) return;
            const v = vehicles[activeIdx];
            document.getElementById('dispV').innerText = v.no;
            document.getElementById('dispQ').innerText = v.q + "L";
            document.getElementById('dispU').innerText = v.u + "L";
            document.getElementById('dispR').innerText = (v.q - v.u) + "L";
            if(v.qr) {
                document.getElementById('mainQr').src = v.qr;
                document.getElementById('mainQr').style.display = 'block';
                document.getElementById('noQrText').style.display = 'none';
            }
        }

        function renderManage() {
            const list = document.getElementById('vList');
            list.innerHTML = '';
            vehicles.forEach((v, i) => {
                list.innerHTML += `<div class="manage-card">
                    <div><b>${v.no}</b><br><small style="opacity:0.4">${v.type}</small></div>
                    <button class="btn-del" onclick="del(${i})">DELETE</button>
                </div>`;
            });
        }

        function openForm() { document.getElementById('formOverlay').style.display = 'flex'; }
        function hideForm() { document.getElementById('formOverlay').style.display = 'none'; }

        function saveData() {
            const no = document.getElementById('inV').value.toUpperCase();
            const q = document.getElementById('inQ').value;
            const u = document.getElementById('inU').value;
            const type = document.getElementById('inT').value;
            const f = document.getElementById('inF').files[0];

            if(!no || !q || !f) return alert("Please fill all fields and select QR!");

            const reader = new FileReader();
            reader.onload = e => {
                vehicles.push({no, q, u, type, qr: e.target.result});
                localStorage.setItem('fuel_v20', JSON.stringify(vehicles));
                hideForm(); renderHome(); switchTab('home', document.getElementById('btnH'));
            };
            reader.readAsDataURL(f);
        }

        function del(i) { if(confirm("Delete this?")) { vehicles.splice(i,1); localStorage.setItem('fuel_v20', JSON.stringify(vehicles)); renderManage(); } }
        
        window.onload = renderHome;
    </script>
</body>
</html>
